name: Release

# Runs on pushes to main only. The former `pull_request: closed` trigger ran an
# "auto-generate changeset" step whose output was never committed (the push
# and publish steps are gated on refs/heads/main, which a pull_request event
# never has) and which templated the PR title and body straight into bash.
on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

# Nothing gets write access by default. The release job asks for what it needs.
permissions:
  contents: read

jobs:
  verify:
    name: Build, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Enable Corepack (pnpm version comes from packageManager)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Architect compliance check
        run: pnpm run architect:check

      - name: Build packages
        run: pnpm run build

      - name: Typecheck all packages
        run: pnpm run typecheck

      - name: Architecture tests
        run: pnpm test

      - name: Package tests
        run: pnpm run test:all

  release:
    name: Version and Publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      # persist-credentials: false keeps the write-scoped GITHUB_TOKEN out of
      # .git/config while `pnpm install` runs dependency build scripts. The
      # push step supplies the token explicitly for that one command.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable Corepack (pnpm version comes from packageManager)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Version packages
        run: |
          if [ -z "$(find .changeset -name '*.md' -not -name 'README.md' -type f 2>/dev/null)" ]; then
            echo "No unreleased changesets found, skipping version step"
            exit 0
          fi
          pnpm changeset version

      - name: Push version changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 0
          fi
          git commit -m "chore: version packages"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH_HEADER"
          git -c http.https://github.com/.extraheader="$AUTH_HEADER" push origin HEAD:main

      # `changeset publish -- --provenance` does not work: @changesets/cli
      # deletes the `--` pass-through before publishing. Provenance is set via
      # config instead. pnpm 11 reads PNPM_CONFIG_*; the NPM_CONFIG_* copy
      # covers an npm fallback.
      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PNPM_CONFIG_PROVENANCE: "true"
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          PUBLISHED=false
          for attempt in 1 2 3 4 5; do
            echo "Publish attempt $attempt"
            if pnpm changeset publish; then
              echo "All packages published successfully"
              PUBLISHED=true
              break
            fi
            echo "Some packages failed, waiting 60s before retry..."
            sleep 60
          done
          if [ "$PUBLISHED" = "false" ]; then
            echo "Failed to publish packages after 5 attempts"
            exit 1
          fi
