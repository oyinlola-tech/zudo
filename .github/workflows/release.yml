name: Release

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version and Publish
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Auto-generate changeset from merged PRs
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"
          MERGED_BY="${{ github.event.pull_request.merged_by.login }}"

          if [[ "$PR_TITLE" =~ ^(feat|fix|chore|docs|refactor|perf|test)\(.*\):\ .* ]] || [[ "$PR_TITLE" =~ ^(feat|fix|chore|docs|refactor|perf|test):\ .* ]]; then
            TYPE=$(echo "$PR_TITLE" | sed -E 's/^(feat|fix|chore|docs|refactor|perf|test).*/\1/')
            SCOPE=$(echo "$PR_TITLE" | sed -E 's/^[^\(]*\(([^\)]*)\).*/\1/' | tr -d ' ')
            SCOPE=${SCOPE:-"cli"}
            
            case $TYPE in
              feat) LEVEL="minor" ;;
              fix) LEVEL="patch" ;;
              major) LEVEL="major" ;;
              *) LEVEL="patch" ;;
            esac
            
            SUMMARY=$(echo "$PR_TITLE" | sed -E 's/^[^:]*:\s*//' | sed -E 's/^[^\)]*\)\s*//')
            
            CHANGESET=".changeset/$(date +%Y-%m-%d)-auto-generated.md"
            echo '---' > "$CHANGESET"
            echo "\"@zudojs/cli\": $LEVEL" >> "$CHANGESET"
            echo '---' >> "$CHANGESET"
            echo '' >> "$CHANGESET"
            echo "$SUMMARY" >> "$CHANGESET"
            echo "Generated changeset: $LEVEL bump for @zudojs/cli"
          else
            echo "No conventional commit detected in PR title, skipping changeset generation"
          fi

      - name: Version packages
        run: |
          if [ -z "$(find .changeset -name '*.md' -not -name 'config.json' -type f 2>/dev/null)" ]; then
            echo "No unreleased changesets found, skipping version step"
            exit 0
          fi
          pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push version changes
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: version packages"
            git push origin main
          fi

      - name: Publish packages
        if: github.ref == 'refs/heads/main'
        run: |
          PUBLISHED=false
          for attempt in 1 2 3 4 5; do
            echo "Publish attempt $attempt"
            if pnpm changeset publish -- --provenance; then
              echo "All packages published successfully"
              PUBLISHED=true
              break
            else
              echo "Some packages failed, waiting 60s before retry..."
              sleep 60
            fi
          done
          if [ "$PUBLISHED" = "false" ]; then
            echo "Failed to publish packages after 5 attempts"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
