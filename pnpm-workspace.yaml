packages:
  - "packages/*"
  - "apps/*"
  - "examples/*"
  - "examples/micro-service/*"
  - "tools/*"

overrides:
  "deepmerge-ts": "8.0.2"
  "mysql2": "^3.22.0"
  "fast-uri": "^3.1.7"

allowBuilds:
  "@prisma/engines": true
  better-sqlite3: true
  esbuild: true
  prisma: true

catalog:
  typescript: ^7.0.2
  "@types/node": ^26.4.0

minimumReleaseAgeExclude:
  - fast-uri@3.1.7
