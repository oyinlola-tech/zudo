packages:
  - "packages/*"
  - "apps/*"
  - "examples/*"
  - "examples/micro-service/*"
  - "tools/*"

overrides:
  "deepmerge-ts": "8.0.2"
  "mysql2": "^3.22.0"
  "fast-uri": "^3.1.7"

allowBuilds:
  "@prisma/engines": true
  better-sqlite3: true
  esbuild: true
  prisma: true

catalog:
  typescript: ^7.0.2
  "@types/node": ^26.4.0

minimumReleaseAgeExclude:
  - fast-uri@3.1.7
  - "@zudojs/core@0.0.1 || 0.1.0"
  - "@zudojs/http@0.0.1 || 0.1.0"
  - "@zudojs/permissions@0.0.1 || 0.1.0"
  - "@zudojs/queue@0.0.1 || 0.1.0"
  - "@zudojs/storage@0.0.1 || 0.1.0"
  - "@zudojs/config@0.1.0"
  - "@zudojs/constants@0.1.0"
  - "@zudojs/container@0.1.0"
  - "@zudojs/errors@0.1.0"
  - "@zudojs/events@0.1.0"
  - "@zudojs/lifecycle@0.1.0"
  - "@zudojs/logger@0.1.0"
  - "@zudojs/messaging@0.1.0"
  - "@zudojs/middleware@0.1.0"
  - "@zudojs/schema@0.1.0"
  - "@zudojs/security@0.1.0"
  - "@zudojs/serialization@0.1.0"
  - "@zudojs/types@0.1.0"
  - "@zudojs/validation@0.1.0"
