  <rect x="20" y="6" width="12" height="12" fill="#1A1A2E"/>
  <rect x="34" y="6" width="12" height="12" fill="#1A1A2E"/>
  <rect x="48" y="6" width="12" height="12" fill="#1A1A2E"/>
  <rect x="62" y="6" width="12" height="12" fill="#1A1A2E"/>
  <rect x="48" y="20" width="12" height="12" fill="#C0392B"/>
  <rect x="34" y="34" width="12" height="12" fill="#C0392B"/>
  <rect x="20" y="48" width="12" height="12" fill="#C0392B"/>
  <rect x="6" y="62" width="12" height="12" fill="#1A1A2E"/>
  <rect x="20" y="62" width="12" height="12" fill="#1A1A2E"/>
  <rect x="34" y="62" width="12" height="12" fill="#1A1A2E"/>
  <rect x="48" y="62" width="12" height="12" fill="#1A1A2E"/>
  <rect x="62" y="62" width="12" height="12" fill="#1A1A2E"/>
</svg>
