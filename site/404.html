<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1A1A2E">
  <title>404 — Page Not Found | Zudo Framework</title>
  <meta name="description" content="The page you're looking for doesn't exist. Return to the Zudo Framework documentation.">
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="icon" type="image/svg+xml" href="/assets/zudo-favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/errors.css">
  <link rel="stylesheet" href="/css/playground.css">
</head>
<body class="bg-zudo-white text-zudo-black min-h-screen flex flex-col">
  <div id="zudo-nav"></div>

  <!-- Main Content -->
  <main class="flex-1 flex items-center justify-center px-6 py-16">
    <div class="text-center max-w-2xl">

      <!-- Error Code -->
      <div class="mb-8">
        <h1
          class="glitch font-black text-[8rem] sm:text-[12rem] leading-none text-black select-none"
          data-text="404"
        >
          404
        </h1>
      </div>

      <!-- Divider -->
      <div class="border-t-4 border-zudo-red mb-8"></div>

      <!-- Message -->
      <h2 class="text-2xl sm:text-3xl font-bold mb-4">
        PAGE NOT FOUND
      </h2>
      <p class="text-base sm:text-lg text-gray-600 mb-8 max-w-md mx-auto leading-relaxed">
        The page you're looking for doesn't exist. It may have been moved, deleted, or you may have entered an incorrect URL.
      </p>

      <!-- Actions -->
      <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
        <a
          href="/"
          class="inline-block bg-zudo-red text-white font-bold text-sm px-8 py-4 border-2 border-black hover:bg-red-700 w-full sm:w-auto text-center"
        >
          GO HOME
        </a>
        <a
          href="/docs/packages"
          class="inline-block bg-white text-black font-bold text-sm px-8 py-4 border-2 border-black hover:bg-zudo-yellow w-full sm:w-auto text-center"
        >
          VIEW DOCUMENTATION
        </a>
        <a
          href="javascript:history.back()"
          class="inline-block bg-white text-black font-bold text-sm px-8 py-4 border-2 border-black hover:bg-gray-100 w-full sm:w-auto text-center"
        >
          GO BACK
        </a>
      </div>

      <!-- Search Hint -->
      <div class="mt-12 border-2 border-dashed border-gray-300 p-6">
        <p class="text-sm text-gray-500 mb-2">Or try searching:</p>
        <div class="flex items-center max-w-md mx-auto border-2 border-black">
          <input
            type="text"
            id="search-input"
            placeholder="Search docs..."
            class="flex-1 px-4 py-3 text-sm font-mono outline-none bg-white"
            aria-label="Search documentation"
          >
          <button
            id="search-btn"
            class="bg-zudo-blue text-white font-bold text-sm px-6 py-3 border-l-2 border-black hover:bg-blue-700"
          >
            SEARCH
          </button>
        </div>
        <p class="text-xs text-gray-400 mt-2">Press <kbd class="border border-gray-300 px-1 py-0.5 text-xs font-mono">Ctrl+K</kbd> to open search</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div id="zudo-footer"></div>

<script src="/js/error-pages.js"></script>

  <script src="/js/components.js"></script>
  <script src="/js/playground.js"></script>
  <script src="/js/effects.js" defer></script>
</body>
</html>
