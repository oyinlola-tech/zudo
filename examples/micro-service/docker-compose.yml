services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - IDENTITY_SERVICE_URL=http://identity:3001
      - ENROLLMENT_SERVICE_URL=http://enrollment:3002
      - ASSESSMENT_SERVICE_URL=http://assessment:3003
      - NOTIFICATION_SERVICE_URL=http://notification:3004
    depends_on:
      - identity
      - enrollment
      - assessment
      - notification

  identity:
    build:
      context: .
      dockerfile: identity/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_FILENAME=./data/identity.db
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET (openssl rand -hex 32)}
      - JWT_EXPIRES_IN=24h
    volumes:
      - identity-data:/app/data

  enrollment:
    build:
      context: .
      dockerfile: enrollment/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_FILENAME=./data/enrollment.db
      - IDENTITY_SERVICE_URL=http://identity:3001
    volumes:
      - enrollment-data:/app/data

  assessment:
    build:
      context: .
      dockerfile: assessment/Dockerfile
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - DATABASE_FILENAME=./data/assessment.db
      - IDENTITY_SERVICE_URL=http://identity:3001
      - ENROLLMENT_SERVICE_URL=http://enrollment:3002
    volumes:
      - assessment-data:/app/data

  notification:
    build:
      context: .
      dockerfile: notification/Dockerfile
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004
      - SMTP_HOST=localhost
      - SMTP_PORT=1025
    volumes:
      - notification-data:/app/data

volumes:
  identity-data:
  enrollment-data:
  assessment-data:
  notification-data:
